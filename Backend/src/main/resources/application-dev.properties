# ── Perfil "dev" ──────────────────────────────────────────────────────────────
# Desarrollo en tu máquina con MySQL y MongoDB locales y Mailpit como servidor
# de correo de pruebas (http://localhost:8025). Actívalo junto al perfil sql (application-local.properties sigue
# reservado para tus secretos personales y está en .gitignore):
#   SPRING_PROFILES_ACTIVE=sql,dev mvn spring-boot:run
# Las variables de entorno siguen teniendo prioridad sobre estos valores.

spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/thinwallet_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thinwallet_db}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:thinwallet@localhost}
spring.mail.password=${MAIL_PASSWORD:local}
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Solo para desarrollo: nunca uses estos secretos fuera de tu máquina.
thinwallet.cipher.master-key=${THINWALLET_CIPHER_MASTER_KEY:local-dev-master-key-0123456789abcdef}
jwt.secret=${JWT_SECRET:local-dev-jwt-secret-0123456789abcdef0123456789}

logging.level.co.edu.unbosque=DEBUG
